# Render Blueprint — Solana Capital Global Tech Equities
# Docs: https://render.com/docs/blueprint-spec
#
# To deploy your own instance:
#   1. Fork this repo on GitHub.
#   2. On render.com → New + → Blueprint → connect the forked repo.
#   3. Render reads this file and provisions the web service automatically.
#   4. (Optional) To gate behind HTTP Basic auth, add a DASHBOARD_PASSWORD env
#      var in the service "Environment" tab. The server picks it up at boot.
#      Leave it unset for a public, no-auth dashboard.
#
# The ETL pipeline does NOT run on Render. Render serves the latest snapshot
# of backend/db/dashboard.db committed to the repo. Refresh the data by
# running `scripts/daily_update.ps1` (or its equivalent) on any machine with
# the repo cloned — it runs the ETL, commits the updated DB, and pushes.
# Render auto-redeploys with the new snapshot in ~2 minutes.

services:
  - type: web
    name: solana-capital-tech-equities
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.api.server:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: "/health"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      # DASHBOARD_PASSWORD is intentionally unset by default → public access.
      # Set it manually in the Render dashboard if you want to gate the app.
