<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Correlation Matrices · Solana Global Tech</title>
<style>
  :root{--bg:#0d1424;--panel:#111a2e;--ink:#dbe4f0;--dim:#7787a0;--grid:#1c2740;--accent:#3fb68b;}
  body{background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,Segoe UI,sans-serif;margin:0;padding:28px;}
  h1{font-size:19px;margin:0 0 4px;} .sub{color:var(--dim);font-size:12px;margin-bottom:18px;}
  .toggle{display:inline-flex;border:1px solid var(--grid);border-radius:8px;overflow:hidden;margin-bottom:14px;}
  .toggle button{background:var(--panel);color:var(--dim);border:0;padding:7px 18px;font-size:13px;cursor:pointer;}
  .toggle button.on{background:var(--accent);color:#06120c;font-weight:600;}
  .wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--grid);border-radius:10px;padding:14px;}
  table{border-collapse:collapse;font-size:11px;}
  th,td{padding:5px 7px;text-align:center;border:1px solid var(--grid);white-space:nowrap;}
  th{color:var(--dim);font-weight:500;font-size:10px;}
  th.row{text-align:right;}
  td{min-width:40px;font-variant-numeric:tabular-nums;}
  .meta{color:var(--dim);font-size:11px;margin-top:10px;}
</style>
</head>
<body>
  <h1>Themes &amp; Buckets · Correlation Matrices</h1>
  <div class="sub">Quali = visão da gestão (input manual) · Quant = correlação histórica dos proxies por bucket. Fonte: corr_matrices.json (update_correlations.py).</div>
  <div class="toggle">
    <button id="btnQuali" class="on" onclick="show('quali')">Quali</button>
    <button id="btnQuant" onclick="show('quant')">Quant</button>
    <button id="btnTickers" onclick="show('tickers')">Tickers</button>
  </div>
  <div class="wrap"><table id="tbl"></table></div>
  <div class="meta" id="meta"></div>

<script>
let DATA = null, MODE = "quali";

// cor: verde (baixa corr = diversificação) -> âmbar -> vermelho (alta corr = concentração)
function cellColor(v){
  if (v === null || v === undefined) return "transparent";
  const t = Math.max(0, Math.min(1, (v - 0.2) / 0.8));
  const stops = [[22,50,40],[63,182,139],[212,160,86],[201,91,74]]; // dark green->green->amber->red
  const seg = t * (stops.length - 1), i = Math.floor(seg), f = seg - i;
  const a = stops[i], b = stops[Math.min(i+1, stops.length-1)];
  const c = a.map((x,k)=>Math.round(x + (b[k]-x)*f));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function textColor(v){ return v >= 0.55 ? "#0c0f14" : "#dbe4f0"; }

function render(){
  const isT = MODE === "tickers";
  const m = isT ? DATA.quant_tickers : DATA[MODE];
  const B = isT ? DATA.tickers : DATA.buckets;
  const n = B.length, fs = isT ? "9px" : "11px", pad = isT ? "2px 3px" : "5px 7px";
  let h = "<tr><th></th>" + B.map(b=>`<th style="font-size:${fs}">${isT ? b : b.split(" ")[0]+"<br>"+(b.split(" ")[1]||"")}</th>`).join("") + "</tr>";
  for (let i=0;i<n;i++){
    h += `<tr><th class="row" style="font-size:${fs}">${B[i]}</th>`;
    for (let j=0;j<n;j++){
      const v = m[i][j];
      h += `<td style="background:${cellColor(v)};color:${textColor(v)};font-size:${fs};padding:${pad};min-width:${isT?28:40}px">${v==null?"—":Number(v).toFixed(2)}</td>`;
    }
    h += "</tr>";
  }
  document.getElementById("tbl").innerHTML = h;
  document.getElementById("btnQuali").className = MODE==="quali" ? "on" : "";
  document.getElementById("btnQuant").className = MODE==="quant" ? "on" : "";
  document.getElementById("btnTickers").className = MODE==="tickers" ? "on" : "";
  document.getElementById("meta").textContent =
    MODE==="tickers"
      ? `Tickers: correlação ${DATA.interval || ""} par a par entre os ${n} tickers do universo de proxies · janela ${DATA.period || ""} · atualizada ${DATA.updated || "—"}`
      : MODE==="quant"
        ? `Quant: retornos ${DATA.interval || ""} · janela ${DATA.period || ""} · atualizada ${DATA.updated || "—"} · proxies equal-weight por bucket`
        : `Quali: premissas da gestão — editadas no Excel (aba Correl Quali) e exportadas pelo script`;
}
function show(m){ MODE = m; render(); }

fetch("/assets/corr_matrices.json")
  .then(r => r.json())
  .then(d => { DATA = d; render(); })
  .catch(() => {
    document.getElementById("tbl").innerHTML =
      "<tr><td style='padding:20px;color:#c95b4a'>corr_matrices.json não encontrado — rode update_correlations.py</td></tr>";
  });
</script>
</body>
</html>
